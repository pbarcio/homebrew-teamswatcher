# Suggested ~/.config/ownscribe/config.toml for an Apple Silicon MacBook, fully local.
# teamswatcher-setup installs this unless you've edited your own copy.

[audio]
backend = "coreaudio"
mic = true
capture_mode = "all"       # TeamsWatcher narrows this to the meeting app with --app
silence_timeout = 300      # safety net; TeamsWatcher normally stops it when the call ends

[transcription]
backend = "mlx"            # Whisper on the Apple Silicon GPU; "whisperx" = the slower CPU backend
model = "large-v3-turbo"   # fast and accurate on the GPU; "medium" if you want it lighter
language = ""              # not fixed: see languages
languages = ["en", "es"]   # calls can switch between English and Spanish at any point; each stretch
                           # of speech is transcribed in its own language. Use ["en"] for English only.
# Prime Whisper with vocabulary it would otherwise mangle (product names are the same in both languages):
initial_prompt = "Manhattan Active Warehouse Management, MAWM, webMethods Integration Server, MIF, Google Cloud Pub/Sub, MuleSoft, Boomi."
hotwords = "MAWM, webMethods, Pub/Sub, MuleSoft, Boomi"

[speakers]
mode = "channels"          # your mic is labeled as you, everything from the call as "Them"
me = ""                    # empty = your macOS account name
them = "Them"

[diarization]
enabled = false            # not needed: [speakers] already separates you from everyone else

[summarization]
enabled = false            # off by default; turn on with "Create Summary" in the TeamsWatcher menu
backend = "local"          # built-in llama.cpp; never calls an external service
# Mid-size local model: Llama 3.1 8B Instruct, Q4_K_M (~4.9GB file, ~6GB in use with 16k context).
# Downloads once, the first time a summary is made; inference stays on the Mac.
model = "hf:bartowski/Meta-Llama-3.1-8B-Instruct-GGUF/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
context_size = 16384

[output]
dir = "~/ownscribe"
format = "markdown"
keep_recording = false     # audio is deleted once transcribed; keep it with "Save Recording" in the menu

[export]
# Each recording gets one folder in ~/ownscribe, e.g. "2026-10-19 1405 - Spec handoff", holding
# "2026-10-19 1405 - Spec handoff.md" (title, date, speakers, summary, transcript; ready to
# upload to Glean), transcript.md, summary.md (if on) and the audio (if saved).
notes = true
include_transcript = true
copy_to = ""               # also copy each notes file here; "auto" = "Meeting Notes" in your work OneDrive
